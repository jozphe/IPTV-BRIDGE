<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand mark: an aperture/bridge arc igniting into an ember -->
  <defs>
    <clipPath id="rounded"><rect width="120" height="120" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="120" height="120" fill="#0a0a0a"/>
    <!-- signal arcs -->
    <path d="M34 78 A34 34 0 0 1 86 78" stroke="#f4f0e8" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
    <path d="M42 78 A24 24 0 0 1 78 78" stroke="#f4f0e8" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 78 A14 14 0 0 1 70 78" stroke="#ff5e2b" stroke-width="4" stroke-linecap="round"/>
    <!-- ember core -->
    <circle cx="60" cy="80" r="6" fill="#ff5e2b"/>
    <!-- rising spark -->
    <path d="M60 66 L60 40" stroke="#ff5e2b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="34" r="5" fill="#ff5e2b"/>
    <circle cx="60" cy="34" r="10" fill="#ff5e2b" fill-opacity="0.2"/>
  </g>
</svg>
